<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS / CAFFEINE LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  ATLAS / CAFFEINE ENERGY LAB
  ═══════════════════════════════════════════════════════════════
  Explores visualizations for the Atlas caffeine + energy tracking feature.

  MODEL: Pharmacokinetic caffeine decay (t½ ≈ 5.5h) + adenosine sleep
  pressure → net alertness curve, peak windows, smart timing stats.

  Each card = one distinct visual approach to the same underlying data.
  Top-bar controls apply globally and re-render all cards instantly.

  WORKFLOW: Open in browser. Tell Claude "card N, do X." Claude edits.
  Refresh. No build step — single file, pure vanilla JS.
  ═══════════════════════════════════════════════════════════════
-->
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #050508;
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.15);
  --green-glow: rgba(74,222,128,0.25);
  --blue: rgba(56,189,248,0.85);
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --border-green: rgba(74,222,128,0.2);
  --text: #ffffff;
  --text-muted: rgba(255,255,255,0.45);
  --text-dim: rgba(255,255,255,0.25);
  --serif: 'Instrument Serif', Georgia, serif;
  --sans: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Top bar ── */
#topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(5,5,8,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 28px;
}

.bar-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--green);
  letter-spacing: 0.12em;
  white-space: nowrap;
}

.bar-section {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bar-section + .bar-section {
  border-left: 1px solid var(--border);
  padding-left: 28px;
}

input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 100px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--green);
  cursor: pointer;
  box-shadow: 0 0 8px var(--green-glow);
}

.bar-val {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-muted);
  min-width: 36px;
}

.add-dose-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  background: var(--green-dim);
  border: 1px solid var(--border-green);
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--green);
  cursor: pointer;
  transition: background 150ms, border-color 150ms;
  letter-spacing: 0.08em;
}
.add-dose-btn:hover { background: rgba(74,222,128,0.22); border-color: rgba(74,222,128,0.4); }

/* dose popup */
#dose-popup {
  display: none;
  position: fixed;
  top: 60px;
  right: 24px;
  z-index: 200;
  background: rgba(14,16,22,0.98);
  border: 1px solid var(--border-green);
  border-radius: 12px;
  padding: 16px;
  width: 220px;
  backdrop-filter: blur(20px);
}
#dose-popup.open { display: block; }
#dose-popup label { font-family: var(--mono); font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 4px; letter-spacing: 0.1em; }
#dose-popup input, #dose-popup select {
  width: 100%;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 8px;
  margin-bottom: 10px;
  outline: none;
}
#dose-popup input:focus, #dose-popup select:focus { border-color: var(--border-green); }
.popup-row { display: flex; gap: 8px; }
.popup-btn {
  flex: 1;
  padding: 7px;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  transition: all 150ms;
}
.popup-btn.primary {
  background: var(--green);
  color: #050508;
  border-color: var(--green);
  font-weight: 600;
}
.popup-btn.primary:hover { opacity: 0.85; }

/* dose pills in topbar */
#dose-list { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
.dose-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 8px 3px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}
.dose-pill-x {
  width: 14px; height: 14px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  cursor: pointer;
  font-size: 9px;
  color: var(--text-dim);
  transition: background 120ms;
}
.dose-pill-x:hover { background: rgba(239,68,68,0.25); color: #f87171; }

/* ── Cards grid ── */
#lab-title {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--green);
  letter-spacing: 0.15em;
}

main {
  padding: 32px 24px 80px;
  max-width: 1400px;
  margin: 0 auto;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: visible;
  position: relative;
  padding: 20px;
  transition: border-color 200ms, box-shadow 200ms;
}
.card:hover { border-color: var(--border-green); box-shadow: 0 0 24px rgba(74,222,128,0.04); }

.card-tag {
  position: absolute;
  top: 14px; left: 14px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--green);
  background: rgba(74,222,128,0.08);
  border: 1px solid var(--border-green);
  border-radius: 4px;
  padding: 3px 7px;
  letter-spacing: 0.12em;
}

.card-actions {
  position: absolute;
  top: 12px; right: 14px;
  display: flex; gap: 8px;
}

.card-btn {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  cursor: pointer;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  background: transparent;
  transition: all 150ms;
}
.card-btn:hover { color: var(--green); border-color: var(--border-green); background: var(--green-dim); }

.card-body { margin-top: 40px; }

/* section header */
.section-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.section-num {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--green);
  letter-spacing: 0.15em;
}
.section-title {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.section-rule {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── Card 1: Energy curve ── */
.energy-chart-wrap {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}

.score-ring-wrap { flex-shrink: 0; }

.score-ring-outer {
  position: relative;
  width: 90px; height: 90px;
}
.score-ring-outer svg { width: 100%; height: 100%; }

.score-ring-center {
  position: absolute;
  inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.score-ring-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 28px;
  line-height: 1;
  color: var(--green);
}
.score-ring-label {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  margin-top: 2px;
}

.score-state {
  margin-top: 8px;
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
}
.score-state-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: ledPulse 2s ease-in-out infinite;
}
@keyframes ledPulse {
  0%,100% { opacity:1; transform: scale(1); }
  50% { opacity:0.4; transform: scale(0.8); }
}

.chart-area { flex: 1; min-width: 0; }

#chart-svg {
  display: block;
  width: 100%;
  overflow: visible;
}

.chart-time-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  padding: 0 2px;
}
.chart-time-labels span {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

/* scrub indicator */
.scrub-indicator {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px;
  opacity: 0;
  transition: opacity 150ms;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
}
.scrub-indicator.visible { opacity: 1; }
.scrub-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.5);
}

/* tooltip */
#chart-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(14,16,22,0.95);
  border: 1px solid var(--border-green);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 11px;
  display: none;
  z-index: 50;
  backdrop-filter: blur(8px);
}
#chart-tooltip .tt-score {
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--green);
  line-height: 1;
}
#chart-tooltip .tt-label {
  font-size: 9px;
  color: var(--text-muted);
  margin-top: 1px;
}
#chart-tooltip.visible { display: block; }

/* ── Card 2: Peak Windows ── */
.peak-windows { display: flex; flex-direction: column; gap: 10px; }

.peak-row {
  display: flex; align-items: center;
  padding: 14px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  transition: border-color 200ms, background 200ms;
}
.peak-row:hover { border-color: var(--border-green); background: rgba(74,222,128,0.04); }
.peak-row.active { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.05); }

.peak-row-left { flex: 1; }
.peak-time-range {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--green);
  line-height: 1;
}
.peak-time-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  margin-top: 3px;
}

.peak-row-right { display: flex; align-items: center; gap: 14px; }
.peak-score-label { font-family: var(--mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.12em; }
.peak-score-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 24px;
  color: var(--text);
  line-height: 1;
}

.block-btn {
  padding: 6px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 150ms;
  white-space: nowrap;
}
.block-btn:hover { background: var(--green-dim); border-color: var(--border-green); color: var(--green); }

/* ── Card 3: Smart Timing ── */
.smart-stats { display: flex; gap: 10px; }
.stat-tile {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 12px;
}
.stat-tile-label {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-dim);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-tile-val {
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--green);
  line-height: 1;
}
.stat-tile-val.warn { color: #fb923c; }
.stat-tile-val.blue { color: var(--blue); }
.stat-tile-desc {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  line-height: 1.4;
}

/* ── Card 4: Dose Stack ── */
.dose-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9px; color: var(--text-muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Card 5: Compact widget ── */
.compact-widget {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.compact-ring { flex-shrink: 0; }
.compact-info { flex: 1; }
.compact-score-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 32px;
  color: var(--green);
  line-height: 1;
}
.compact-score-label { font-family: var(--mono); font-size: 9px; color: var(--text-muted); letter-spacing: 0.12em; margin-top: 2px; }
.compact-next-peak {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
}
.compact-next-peak span { color: var(--green); }

.mini-spark { flex-shrink: 0; }

/* ── Card 6: Dose timeline ── */
.dose-timeline { position: relative; }
.timeline-track {
  position: relative;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin: 20px 0 24px;
}
.timeline-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--green);
  border-radius: 2px;
  opacity: 0.3;
}
.timeline-marker {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
}
.timeline-marker-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--green);
  border: 2px solid var(--bg);
  box-shadow: 0 0 8px var(--green-glow);
  transition: transform 150ms;
}
.timeline-marker:hover .timeline-marker-dot { transform: scale(1.3); }
.timeline-marker-label {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-muted);
  white-space: nowrap;
  background: rgba(5,5,8,0.9);
  padding: 2px 5px;
  border-radius: 3px;
  border: 1px solid var(--border);
}
.timeline-now {
  position: absolute;
  top: -6px; bottom: -6px;
  width: 2px;
  background: rgba(255,255,255,0.5);
  border-radius: 1px;
}
.timeline-now::after {
  content: 'NOW';
  position: absolute;
  bottom: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 7px;
  color: var(--text-dim);
  letter-spacing: 0.1em;
}
.timeline-time-labels {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-dim);
  margin-top: 8px;
}

/* remaining caffeine bar */
.caf-remaining {
  margin-top: 16px;
  display: flex; align-items: center; gap: 10px;
}
.caf-remaining-label { font-family: var(--mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; width: 90px; }
.caf-bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.caf-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--green), rgba(74,222,128,0.4)); transition: width 300ms; }
.caf-bar-val { font-family: var(--mono); font-size: 10px; color: var(--text-muted); min-width: 50px; text-align: right; }

/* alert strip */
.alert-strip {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px;
  padding: 10px 12px;
  background: rgba(251,146,60,0.06);
  border: 1px solid rgba(251,146,60,0.2);
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 10px;
  color: #fb923c;
  letter-spacing: 0.05em;
}
.alert-strip .alert-icon { font-size: 12px; }

/* scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── Topbar ── -->
<div id="topbar">
  <div class="bar-label" id="lab-title">ATLAS / CAFFEINE LAB</div>

  <div class="bar-section">
    <span class="bar-label">WAKE</span>
    <input type="range" id="ctrl-wake" min="4" max="10" step="0.5" value="7">
    <span class="bar-val" id="val-wake">7:00a</span>
  </div>

  <div class="bar-section">
    <span class="bar-label">SLEEP</span>
    <input type="range" id="ctrl-sleep" min="0" max="100" step="5" value="75">
    <span class="bar-val" id="val-sleep">Good</span>
  </div>

  <div class="bar-section">
    <span class="bar-label">NOW</span>
    <input type="range" id="ctrl-now" min="4" max="24" step="0.25" value="14">
    <span class="bar-val" id="val-now">2:00p</span>
  </div>

  <div class="bar-section">
    <div id="dose-list"></div>
    <button class="add-dose-btn" id="add-dose-btn">＋ DOSE</button>
  </div>
</div>

<!-- ── Dose popup ── -->
<div id="dose-popup">
  <label>TIME</label>
  <input type="time" id="dp-time" value="09:00">
  <label>CAFFEINE (MG)</label>
  <select id="dp-mg">
    <option value="75">Espresso · 75mg</option>
    <option value="100" selected>Coffee · 100mg</option>
    <option value="150">Large coffee · 150mg</option>
    <option value="200">Double shot · 200mg</option>
    <option value="80">Tea · 80mg</option>
    <option value="150">Energy drink · 150mg</option>
  </select>
  <label>LABEL</label>
  <input type="text" id="dp-label" value="Coffee">
  <div class="popup-row">
    <button class="popup-btn" id="dp-cancel">CANCEL</button>
    <button class="popup-btn primary" id="dp-add">ADD</button>
  </div>
</div>

<main>
  <div class="card-grid">

    <!-- ── CARD 01: Energy Curve ── -->
    <div class="card" style="grid-column: 1 / -1;" id="card-01">
      <div class="card-tag">01 · ENERGY CURVE</div>
      <div class="card-actions">
        <button class="card-btn" onclick="replayCard('card-01')">↺ replay</button>
        <button class="card-btn" onclick="copyCard('card-01')">⊡ copy</button>
      </div>
      <div class="card-body">
        <div class="section-header">
          <span class="section-num">01</span>
          <span class="section-title">YOUR DAY</span>
          <div class="section-rule"></div>
        </div>

        <div class="energy-chart-wrap" id="chart-01-wrap">
          <!-- Score ring -->
          <div class="score-ring-wrap">
            <div class="score-ring-outer">
              <svg viewBox="0 0 90 90" id="ring-svg-01">
                <circle cx="45" cy="45" r="38" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="5"/>
                <circle cx="45" cy="45" r="38" fill="none" stroke="#4ade80" stroke-width="5"
                  stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="60"
                  transform="rotate(-90 45 45)" id="ring-arc-01"
                  style="transition: stroke-dashoffset 400ms cubic-bezier(.16,1,.3,1), stroke 300ms"/>
              </svg>
              <div class="score-ring-center">
                <div class="score-ring-num" id="ring-num-01">72</div>
                <div class="score-ring-label">ENERGY</div>
              </div>
            </div>
            <div class="score-state">
              <div class="score-state-dot" id="ring-dot-01"></div>
              <span id="ring-state-01">Peak</span>
            </div>
          </div>

          <!-- Chart -->
          <div class="chart-area" id="chart-01" style="position:relative; cursor:crosshair;">
            <svg id="chart-svg" height="160" viewBox="0 0 800 160" preserveAspectRatio="none">
              <defs>
                <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#4ade80" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#4ade80" stop-opacity="0.02"/>
                </linearGradient>

<script>
// ═══════════════════════════════════════════════════════════════
// MODEL
// ═══════════════════════════════════════════════════════════════

const HALF_LIFE_H = 5.5;      // caffeine half-life in hours
const ABSORPTION_TAU = 0.8;   // absorption time constant (peak ~45min)
const ADENOSINE_RATE = 3.8;   // sleep pressure units per hour awake
const CAF_SCALE = 0.13;       // mg → energy units (200mg ≈ 26 units at peak)

const DOSE_COLORS = ['#4ade80', '#38bdf8', '#a78bfa', '#fb923c', '#f472b6'];

// App state
let state = {
  wakeHour: 7,
  sleepQuality: 75,
  currentHour: 14,
  doses: [
    { id: 1, hour: 7.5,  mg: 100, label: 'Coffee' },
    { id: 2, hour: 13.0, mg: 80,  label: 'Coffee' },
  ],
  nextId: 3,
};

// Caffeine concentration from single dose at time t after dosing
function caffeineConc(t, mg) {
  if (t <= 0) return 0;
  const absorption = 1 - Math.exp(-t / ABSORPTION_TAU);
  const decay = Math.exp(-t * Math.LN2 / HALF_LIFE_H);
  return mg * absorption * decay;
}

// Total caffeine (mg equivalent) in system at given hour
function totalCaffeineAt(hour) {
  return state.doses.reduce((sum, d) => sum + caffeineConc(hour - d.hour, d.mg), 0);
}

// Net energy score 0-100 at given hour
function energyAt(hour) {
  const { wakeHour, sleepQuality, doses } = state;
  if (hour < wakeHour - 1) return null;

  const hoursAwake = Math.max(0, hour - wakeHour);

  // Baseline energy from sleep quality (40-68)
  const baseline = 40 + sleepQuality * 0.28;

  // Caffeine contribution
  let cafEnergy = 0;
  for (const d of doses) {
    cafEnergy += caffeineConc(hour - d.hour, d.mg) * CAF_SCALE;
  }

  // Adenosine accumulation
  const pressure = hoursAwake * ADENOSINE_RATE;

  return Math.max(0, Math.min(100, baseline + cafEnergy - pressure));
}

// Per-dose contribution at given hour
function doseEnergyAt(hour, dose) {
  return caffeineConc(hour - dose.hour, dose.mg) * CAF_SCALE;
}

// Compute peak windows (continuous segments where energy > threshold)
function computePeakWindows() {
  const THRESHOLD = 62;
  const step = 0.25;
  const windows = [];
  let inWin = false, winStart = 0, winPeak = 0, winPeakH = 0;

  for (let h = state.wakeHour; h <= 24; h += step) {
    const e = energyAt(h);
    if (e >= THRESHOLD && !inWin) {
      inWin = true; winStart = h; winPeak = e; winPeakH = h;
    } else if (e >= THRESHOLD && inWin) {
      if (e > winPeak) { winPeak = e; winPeakH = h; }
    } else if (e < THRESHOLD && inWin) {
      inWin = false;
      if (h - winStart > 0.5) windows.push({ start: winStart, end: h, peak: Math.round(winPeak), peakH: winPeakH });
    }
  }
  if (inWin) windows.push({ start: winStart, end: 24, peak: Math.round(winPeak), peakH: winPeakH });

  return windows.sort((a, b) => b.peak - a.peak).slice(0, 3);
}

// Find next crash (energy < 50 after peak)
function predictCrash() {
  const now = state.currentHour;
  let pastPeak = false;
  let peakE = 0;

  for (let h = now; h <= 24; h += 0.25) {
    const e = energyAt(h) || 0;
    if (!pastPeak && e > peakE) { peakE = e; }
    else if (!pastPeak && e < peakE - 5) { pastPeak = true; }
    if (pastPeak && e < 50) return h;
  }
  return null;
}

// Last dose that won't disrupt sleep at bedtime
function lastCoffeeBy(bedtime = 23, threshold_mg = 25) {
  // Find latest time where caffeine remaining at bedtime < threshold
  // caffeine_at_bedtime(dose_time) = mg * absorption(bedtime-t) * decay(bedtime-t)
  // Approximate: solve for t where conc < 25mg
  // rough: 25 = 200 * e^(-t*0.126) → t = ln(200/25)/0.126 ≈ 16.5h → suboptimal for small doses
  // simpler: binary search
  const mg = 100; // typical dose
  let lo = state.wakeHour, hi = bedtime;
  for (let i = 0; i < 30; i++) {
    const mid = (lo + hi) / 2;
    const remaining = caffeineConc(bedtime - mid, mg);
    if (remaining < threshold_mg) lo = mid; else hi = mid;
  }
  return lo;
}

// ═══════════════════════════════════════════════════════════════
// CHART HELPERS
// ═══════════════════════════════════════════════════════════════

const CHART_START_OFFSET = 1; // hours before wake to show
const CHART_END_H = 24;
const SVG_W = 800;

function hToX(h) {
  const startH = state.wakeHour - CHART_START_OFFSET;
  return ((h - startH) / (CHART_END_H - startH)) * SVG_W;
}
function eToY(e, H) { return H - (e / 100) * H; }

function buildCurvePoints(H) {
  const startH = state.wakeHour - CHART_START_OFFSET;
  const pts = [];
  for (let h = startH; h <= CHART_END_H; h += 0.25) {
    const e = energyAt(h);
    if (e !== null) pts.push([hToX(h), eToY(e, H)]);
  }
  return pts;
}

function ptsToPolyline(pts) {
  return pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
}

function ptsToArea(pts, H) {
  if (!pts.length) return '';
  const first = pts[0], last = pts[pts.length - 1];
  let d = `M ${first[0].toFixed(1)} ${H}`;
  d += ` L ${first[0].toFixed(1)} ${first[1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    d += ` L ${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
  }
  d += ` L ${last[0].toFixed(1)} ${H} Z`;
  return d;
}

function formatHour(h) {
  const hr = Math.floor(h);
  const min = Math.round((h - hr) * 60);
  const suffix = hr < 12 ? 'a' : 'p';
  const displayH = hr === 0 ? 12 : hr > 12 ? hr - 12 : hr;
  return min > 0 ? `${displayH}:${String(min).padStart(2,'0')}${suffix}` : `${displayH}${suffix}`;
}

function formatHourRange(start, end) {
  const fh = h => {
    const hr = Math.floor(h);
    const min = Math.round((h - hr) * 60);
    const displayH = hr === 0 ? 12 : hr > 12 ? hr - 12 : hr;
    const suffix = hr < 12 ? 'a' : 'p';
    return min > 0 ? `${displayH}:${String(min).padStart(2,'0')}${suffix}` : `${displayH}${suffix}`;
  };
  return `${fh(start)}–${fh(end)}`;
}

function energyLabel(e) {
  if (e >= 80) return 'Peak';
  if (e >= 65) return 'High';
  if (e >= 50) return 'Moderate';
  if (e >= 35) return 'Low';
  return 'Crash';
}

function energyColor(e) {
  if (e >= 65) return '#4ade80';
  if (e >= 45) return '#fb923c';
  return '#f87171';
}

// ═══════════════════════════════════════════════════════════════
// RENDER FUNCTIONS
// ═══════════════════════════════════════════════════════════════

function renderCard01() {
  const H = 160;
  const pts = buildCurvePoints(H);

  // Area + line
  document.getElementById('area-path-01').setAttribute('d', ptsToArea(pts, H));
  document.getElementById('line-path-01').setAttribute('points', ptsToPolyline(pts));

  // Dose markers
  const dg = document.getElementById('dose-markers-01');
  dg.innerHTML = '';
  state.doses.forEach((d, i) => {
    const x = hToX(d.hour);
    const e = energyAt(d.hour) || 0;
    const y = eToY(e, H);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', x); circle.setAttribute('cy', y); circle.setAttribute('r', 4);
    circle.setAttribute('fill', DOSE_COLORS[i % DOSE_COLORS.length]);
    circle.setAttribute('stroke', '#050508'); circle.setAttribute('stroke-width', '2');
    g.appendChild(circle);
    // label above
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', x); txt.setAttribute('y', y - 10);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('fill', 'rgba(255,255,255,0.4)');
    txt.setAttribute('font-size', '8');
    txt.setAttribute('font-family', 'JetBrains Mono, monospace');
    txt.textContent = `${d.mg}mg`;
    g.appendChild(txt);
    dg.appendChild(g);
  });

  // Now line
  const nowX = hToX(state.currentHour);
  const nl = document.getElementById('now-line-01');
  nl.setAttribute('x1', nowX); nl.setAttribute('x2', nowX);

  // Ring
  const currentE = energyAt(state.currentHour) || 0;
  const ring = document.getElementById('ring-arc-01');
  const circumference = 2 * Math.PI * 38;
  const offset = circumference * (1 - currentE / 100);
  ring.setAttribute('stroke-dasharray', circumference.toFixed(1));
  ring.setAttribute('stroke-dashoffset', offset.toFixed(1));
  ring.setAttribute('stroke', energyColor(currentE));
  document.getElementById('ring-num-01').textContent = Math.round(currentE);
  document.getElementById('ring-num-01').style.color = energyColor(currentE);
  document.getElementById('ring-state-01').textContent = energyLabel(currentE);

  // Time labels
  const startH = state.wakeHour - CHART_START_OFFSET;
  const labels = document.getElementById('time-labels-01');
  const labelHours = [];
  for (let h = Math.ceil(startH); h <= 24; h += 3) labelHours.push(h);
  labels.innerHTML = labelHours.map(h => `<span>${formatHour(h)}</span>`).join('');
}

function setupChart01Scrub() {
  const chartEl = document.getElementById('chart-01');
  const scrubLine = document.getElementById('scrub-line-01');
  const scrubDot = document.getElementById('scrub-dot-01');
  const tooltip = document.getElementById('chart-tooltip');
  const indicator = document.getElementById('scrub-indicator-01');
  const ring = document.getElementById('ring-arc-01');
  const ringNum = document.getElementById('ring-num-01');
  const ringState = document.getElementById('ring-state-01');
  const H = 160;

  function onMove(e) {
    const rect = chartEl.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const relX = (clientX - rect.left) / rect.width;
    const svgX = relX * SVG_W;

    const startH = state.wakeHour - CHART_START_OFFSET;
    const h = startH + relX * (CHART_END_H - startH);
    const energy = energyAt(h);
    if (energy === null) return;

    const svgY = eToY(energy, H);

    scrubLine.setAttribute('x1', svgX); scrubLine.setAttribute('x2', svgX);
    scrubLine.style.display = 'block';
    scrubDot.setAttribute('cx', svgX); scrubDot.setAttribute('cy', svgY);
    scrubDot.style.display = 'block';
    scrubDot.setAttribute('fill', energyColor(energy));

    indicator.classList.add('visible');
    indicator.querySelector('span').textContent = `${formatHour(h)} · ${Math.round(energy)}`;

    // Update ring to show scrub time
    const circumference = 2 * Math.PI * 38;
    const offset = circumference * (1 - energy / 100);
    ring.setAttribute('stroke-dashoffset', offset.toFixed(1));
    ring.setAttribute('stroke', energyColor(energy));
    ringNum.textContent = Math.round(energy);
    ringNum.style.color = energyColor(energy);
    ringState.textContent = energyLabel(energy);

    // Tooltip
    const ttX = clientX - rect.left;
    const ttY = (svgY / H) * chartEl.clientHeight;
    tooltip.innerHTML = `<div class="tt-score" style="color:${energyColor(energy)}">${Math.round(energy)}</div><div class="tt-label">${formatHour(h)}</div>`;
    tooltip.className = 'chart-tooltip visible';
    const ttLeft = ttX > rect.width * 0.7 ? ttX - 80 : ttX + 14;
    tooltip.style.left = ttLeft + 'px';
    tooltip.style.top = (ttY - 20) + 'px';
  }

  function onLeave() {
    scrubLine.style.display = 'none';
    scrubDot.style.display = 'none';
    tooltip.className = 'chart-tooltip';
    indicator.classList.remove('visible');
    // restore to "now"
    renderCard01();
  }

  chartEl.addEventListener('mousemove', onMove);
  chartEl.addEventListener('touchmove', onMove, { passive: true });
  chartEl.addEventListener('mouseleave', onLeave);
  chartEl.addEventListener('touchend', onLeave);
}

function renderCard02() {
  const wins = computePeakWindows();
  const now = state.currentHour;
  const el = document.getElementById('peak-windows-02');
  el.innerHTML = '';

  if (!wins.length) {
    el.innerHTML = '<div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);padding:16px;text-align:center;">No peak windows today — try adding caffeine or adjusting sleep quality</div>';
    return;
  }

  wins.forEach((w, i) => {
    const isActive = now >= w.start && now <= w.end;
    const isPast = w.end < now;
    const label = isActive ? '● IN IT NOW' : isPast ? 'PAST' : `PEAKS ${formatHour(w.peakH).toUpperCase()}`;

    const row = document.createElement('div');
    row.className = `peak-row${isActive ? ' active' : ''}`;
    if (isPast) row.style.opacity = '0.45';

    row.innerHTML = `
      <div class="peak-row-left">
        <div class="peak-time-range">${formatHourRange(w.start, w.end)}</div>
        <div class="peak-time-sub" style="color:${isActive ? 'var(--green)' : 'var(--text-muted)'}">${label}</div>
      </div>
      <div class="peak-row-right">
        <div>
          <div class="peak-score-label">PEAK</div>
          <div class="peak-score-num">${w.peak}</div>
        </div>
        <button class="block-btn">Block →</button>
      </div>
    `;
    el.appendChild(row);
  });
}

function renderCard03() {
  const el = document.getElementById('smart-stats-03');
  const wins = computePeakWindows();
  const crash = predictCrash();
  const lastCoffee = lastCoffeeBy();
  const now = state.currentHour;

  // Find best upcoming window
  const nextWin = wins.find(w => w.end > now);
  const peakFocusStr = nextWin
    ? formatHourRange(nextWin.start, nextWin.end)
    : 'None today';

  const crashStr = crash ? formatHour(crash) : 'After midnight';
  const lastCoffeeStr = formatHour(lastCoffee);

  const crashSoon = crash && crash - now < 2;
  const lastCoffeePast = lastCoffee < now;

  el.innerHTML = `
    <div class="stat-tile">
      <div class="stat-tile-label">PEAK FOCUS</div>
      <div class="stat-tile-val">${peakFocusStr}</div>
      <div class="stat-tile-desc">${nextWin ? `Score ${nextWin.peak} · ${nextWin.end - nextWin.start < 2 ? 'Short' : 'Long'} window` : 'All windows passed'}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">PREDICTED CRASH</div>
      <div class="stat-tile-val ${crashSoon ? 'warn' : ''}">${crashStr.includes('After') ? crashStr : '~' + crashStr}</div>
      <div class="stat-tile-desc">${crashSoon ? 'Coming soon — consider a small dose' : 'Energy drops below 50'}</div>
    </div>
    <div class="stat-tile">
      <div class="stat-tile-label">LAST COFFEE BY</div>
      <div class="stat-tile-val ${lastCoffeePast ? 'warn' : 'blue'}">${lastCoffeeStr}</div>
      <div class="stat-tile-desc">To keep &lt;25mg at 11 PM bedtime</div>
    </div>
  `;
}

function renderCard04() {
  const el = document.getElementById('dose-timeline-04');
  const startH = state.wakeHour - 0.5;
  const endH = 24;
  const span = endH - startH;
  const now = state.currentHour;

  // Build caffeine remaining bars
  const cafBars = state.doses.map((d, i) => {
    const remaining = caffeineConc(now - d.hour, d.mg);
    const pct = Math.min(100, (remaining / d.mg) * 100);
    return { d, i, remaining: Math.round(remaining), pct };
  });

  const totalRemaining = cafBars.reduce((s, b) => s + b.remaining, 0);
  const maxMg = state.doses.reduce((s, d) => s + d.mg, 0) || 1;
  const totalPct = Math.min(100, (totalRemaining / maxMg) * 100);

  const markerHtml = state.doses.map((d, i) => {
    const pct = ((d.hour - startH) / span * 100).toFixed(1);
    const color = DOSE_COLORS[i % DOSE_COLORS.length];
    return `
      <div class="timeline-marker" style="left:${pct}%">
        <div class="timeline-marker-label">${d.label} · ${d.mg}mg</div>
        <div class="timeline-marker-dot" style="background:${color}; box-shadow:0 0 8px ${color}66;"></div>
      </div>`;
  }).join('');

  const nowPct = ((now - startH) / span * 100).toFixed(1);

  // Time labels
  const labelHours = [6, 9, 12, 15, 18, 21, 24].filter(h => h >= startH && h <= endH);

  // Alert if past last coffee time
  const lastCoffee = lastCoffeeBy();
  const alertHtml = now > lastCoffee ? `
    <div class="alert-strip">
      <span class="alert-icon">⚠</span>
      Past last coffee window (${formatHour(lastCoffee)}) — a dose now may affect sleep
    </div>` : '';

  el.innerHTML = `
    <div class="timeline-track">
      <div class="timeline-fill" style="width:${nowPct}%"></div>
      ${markerHtml}
      <div class="timeline-now" style="left:${nowPct}%"></div>
    </div>
    <div class="timeline-time-labels">
      ${labelHours.map(h => `<span>${formatHour(h)}</span>`).join('')}
    </div>

    <div style="margin-top:16px;">
      <div class="caf-remaining">
        <div class="caf-remaining-label">TOTAL ACTIVE</div>
        <div class="caf-bar-track"><div class="caf-bar-fill" style="width:${totalPct.toFixed(0)}%"></div></div>
        <div class="caf-bar-val">${totalRemaining}mg</div>
      </div>
      ${cafBars.map(({d, i, remaining, pct}) => `
      <div class="caf-remaining">
        <div class="caf-remaining-label" style="color:${DOSE_COLORS[i % DOSE_COLORS.length]}88">${formatHour(d.hour)} · ${d.label}</div>
        <div class="caf-bar-track"><div class="caf-bar-fill" style="width:${pct.toFixed(0)}%; background: linear-gradient(90deg, ${DOSE_COLORS[i % DOSE_COLORS.length]}, ${DOSE_COLORS[i % DOSE_COLORS.length]}44)"></div></div>
        <div class="caf-bar-val">${remaining}mg</div>
      </div>`).join('')}
    </div>
    ${alertHtml}
  `;
}

function renderCard05() {
  const el = document.getElementById('compact-widget-05');
  const currentE = energyAt(state.currentHour) || 0;
  const wins = computePeakWindows();
  const nextWin = wins.find(w => w.end > state.currentHour);
  const circumference = 2 * Math.PI * 28;
  const offset = circumference * (1 - currentE / 100);
  const color = energyColor(currentE);

  // Mini spark: last 4 hours and next 4 hours
  const sparkHours = 8;
  const sparkStart = state.currentHour - 4;
  const sparkPts = [];
  for (let h = sparkStart; h <= sparkStart + sparkHours; h += 0.5) {
    const e = energyAt(h) || 0;
    sparkPts.push(e);
  }
  const sparkW = 120, sparkH2 = 40;
  const sparkSvgPts = sparkPts.map((e, i) => {
    const x = (i / (sparkPts.length - 1)) * sparkW;
    const y = sparkH2 - (e / 100) * sparkH2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const nowI = Math.round(sparkPts.length / 2);
  const nowSparkX = (nowI / (sparkPts.length - 1)) * sparkW;

  el.innerHTML = `
    <div class="compact-widget">
      <div class="compact-ring">
        <svg width="70" height="70" viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="28" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
          <circle cx="35" cy="35" r="28" fill="none" stroke="${color}" stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="${circumference.toFixed(1)}"
            stroke-dashoffset="${offset.toFixed(1)}"
            transform="rotate(-90 35 35)"/>
          <text x="35" y="40" text-anchor="middle" font-family="Instrument Serif, serif" font-style="italic" font-size="18" fill="${color}">${Math.round(currentE)}</text>
        </svg>
      </div>
      <div class="compact-info">
        <div class="compact-score-num" style="color:${color}; font-size:22px">${energyLabel(currentE)}</div>
        <div class="compact-score-label">AT ${formatHour(state.currentHour).toUpperCase()}</div>
        ${nextWin ? `<div class="compact-next-peak">Next peak <span>${formatHourRange(nextWin.start, nextWin.end)}</span></div>` : ''}
      </div>
      <div class="mini-spark">
        <svg width="${sparkW}" height="${sparkH2}" viewBox="0 0 ${sparkW} ${sparkH2}" style="overflow:visible;">
          <defs>
            <linearGradient id="miniGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
            </linearGradient>
          </defs>
          <line x1="${nowSparkX}" y1="-4" x2="${nowSparkX}" y2="${sparkH2}" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="2,3"/>
          <polyline points="${sparkSvgPts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  `;
}

function renderCard06() {
  const H = 130;
  const startH = state.wakeHour - CHART_START_OFFSET;

  // Legend
  const legend = document.getElementById('dose-legend-06');
  legend.innerHTML = state.doses.map((d, i) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${DOSE_COLORS[i % DOSE_COLORS.length]}"></div>
      ${formatHour(d.hour)} · ${d.mg}mg ${d.label}
    </div>`).join('');

  // Per-dose areas
  const layersEl = document.getElementById('stack-layers-06');
  layersEl.innerHTML = '';

  // Find max possible energy for normalizing
  const maxContrib = 100;

  state.doses.forEach((dose, i) => {
    const color = DOSE_COLORS[i % DOSE_COLORS.length];
    const pts = [];
    for (let h = startH; h <= CHART_END_H; h += 0.25) {
      const contrib = doseEnergyAt(h, dose);
      const x = hToX(h);
      const y = H - (Math.min(contrib, 40) / 40) * H;
      pts.push([x, y]);
    }

    // Area path
    const first = pts[0], last = pts[pts.length - 1];
    let d = `M ${first[0].toFixed(1)} ${H} L ${first[0].toFixed(1)} ${first[1].toFixed(1)}`;
    for (let j = 1; j < pts.length; j++) d += ` L ${pts[j][0].toFixed(1)} ${pts[j][1].toFixed(1)}`;
    d += ` L ${last[0].toFixed(1)} ${H} Z`;

    const area = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    area.setAttribute('d', d);
    area.setAttribute('fill', color);
    area.setAttribute('fill-opacity', '0.2');
    area.setAttribute('stroke', color);
    area.setAttribute('stroke-width', '1.5');
    area.setAttribute('stroke-opacity', '0.6');
    layersEl.appendChild(area);
  });

  // Total energy line
  const totalPts = [];
  for (let h = startH; h <= CHART_END_H; h += 0.25) {
    const e = energyAt(h) || 0;
    totalPts.push([hToX(h), eToY(e, H)]);
  }
  document.getElementById('stack-total-06').setAttribute('points', ptsToPolyline(totalPts));

  // Time labels
  const labels = document.getElementById('stack-time-labels-06');
  const labelHours = [];
  for (let h = Math.ceil(startH); h <= 24; h += 3) labelHours.push(h);
  labels.innerHTML = labelHours.map(h => `<span>${formatHour(h)}</span>`).join('');
}

function renderAll() {
  renderCard01();
  renderCard02();
  renderCard03();
  renderCard04();
  renderCard05();
  renderCard06();
  renderDoseList();
}

function renderDoseList() {
  const el = document.getElementById('dose-list');
  el.innerHTML = state.doses.map((d, i) => `
    <div class="dose-pill">
      <span style="color:${DOSE_COLORS[i % DOSE_COLORS.length]}">${formatHour(d.hour)}</span>
      <span>${d.mg}mg</span>
      <div class="dose-pill-x" onclick="removeDose(${d.id})">×</div>
    </div>`).join('');
}

function removeDose(id) {
  state.doses = state.doses.filter(d => d.id !== id);
  renderAll();
}

function sleepLabel(q) {
  if (q >= 85) return 'Great';
  if (q >= 65) return 'Good';
  if (q >= 40) return 'Fair';
  return 'Poor';
}

// Wake ctrl
document.getElementById('ctrl-wake').addEventListener('input', function() {
  state.wakeHour = parseFloat(this.value);
  document.getElementById('val-wake').textContent = formatHour(state.wakeHour);
  renderAll();
});

// Sleep ctrl
document.getElementById('ctrl-sleep').addEventListener('input', function() {
  state.sleepQuality = parseInt(this.value);
  document.getElementById('val-sleep').textContent = sleepLabel(state.sleepQuality);
  renderAll();
});

// Now ctrl
document.getElementById('ctrl-now').addEventListener('input', function() {
  state.currentHour = parseFloat(this.value);
  document.getElementById('val-now').textContent = formatHour(state.currentHour);
  renderAll();
});

// Dose popup
document.getElementById('add-dose-btn').addEventListener('click', () => {
  document.getElementById('dose-popup').classList.toggle('open');
});
document.getElementById('dp-cancel').addEventListener('click', () => {
  document.getElementById('dose-popup').classList.remove('open');
});
document.getElementById('dp-add').addEventListener('click', () => {
  const timeVal = document.getElementById('dp-time').value;
  const [hh, mm] = timeVal.split(':').map(Number);
  const hour = hh + mm / 60;
  const mg = parseInt(document.getElementById('dp-mg').value);
  const label = document.getElementById('dp-label').value || 'Coffee';
  state.doses.push({ id: state.nextId++, hour, mg, label });
  state.doses.sort((a, b) => a.hour - b.hour);
  document.getElementById('dose-popup').classList.remove('open');
  renderAll();
});

// Card actions
function replayCard(id) {
  const card = document.getElementById(id);
  card.style.opacity = '0';
  card.style.transform = 'translateY(8px)';
  setTimeout(() => {
    card.style.transition = 'opacity 400ms cubic-bezier(.16,1,.3,1), transform 400ms cubic-bezier(.16,1,.3,1)';
    card.style.opacity = '1';
    card.style.transform = 'translateY(0)';
  }, 50);
  renderAll();
}

function copyCard(id) {
  const el = document.getElementById(id);
  const text = el.innerText;
  navigator.clipboard.writeText(text).catch(() => {});
  const btn = el.querySelector('.card-btn:last-child');
  const orig = btn.textContent;
  btn.textContent = '✓ copied';
  btn.style.color = 'var(--green)';
  setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1200);
}
